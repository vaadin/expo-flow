server.port=${PORT:8888}
# Set the session cookie name to something that is not used by any other application
server.servlet.session.cookie.name=EXPOFLOWAPPSESSION

logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.allowed-packages = com.vaadin,org.vaadin,dev.hilla,com.example.application

spring.ai.openai.api-key=${OPENAI_API_KEY}

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2
# Datasource
spring.datasource.url=jdbc:h2:file:~/t-shirt-orders
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# Devoxx Belgium 2026 talk search (DevoxxTalksView)
# Talks are loaded live from here; without network the copy in src/main/resources/devoxx/ is used.
devoxx.schedule-url=https://dvbe26.cfp.dev/api/public/schedules/
# Pretend it is this (conference) time, for rehearsing "what's next?", e.g. 2026-10-07T10:15
devoxx.demo-time=${DEVOXX_DEMO_TIME:}

# draiv: the AI search drives the live UI through Spring AI tool calling.
# Provider: openai | anthropic | mistral. Only the selected one needs a real key.
presenter.chat.provider=${PRESENTER_CHAT_PROVIDER:openai}
openai.text.model=${OPENAI_TEXT_MODEL:gpt-5}
openai.text.reasoning-effort=minimal
anthropic.text.model=${ANTHROPIC_TEXT_MODEL:claude-haiku-4-5}
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-configured}
spring.ai.mistralai.api-key=${MISTRAL_API_KEY:not-configured}
# No login in this app: every browser tab is its own demo principal.
draiv.session.demo-identity=true
# Not used here, and the MCP server would let anyone on the network drive the UI.
draiv.ai.realtime.enabled=false
spring.ai.mcp.server.enabled=false
