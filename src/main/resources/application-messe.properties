# Trade-show profile: ./mvnw -Dspring-boot.run.profiles=messe (add ,mcp for the Claude Desktop demo).
# A fresh in-memory database on every start, so the demo always begins with the same invoices; nothing
# touches ~/t-shirt-orders. "Demo zurücksetzen" in the AI area resets it while running.
spring.datasource.url=jdbc:h2:mem:messe;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
# The laptop drives the big screen itself; no browser tab popping up on restart
vaadin.launch-browser=false
