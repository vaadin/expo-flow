# MCP add-on demo (McpDemoConfig): Claude Desktop drives the UI over http://localhost:8888/mcp.
# Only requests from this machine get through; see docs/mcp-demo.md.
spring.ai.mcp.server.enabled=true
# Explicitly: without it Spring AI 2.0.2 serves the older SSE transport at /sse, not /mcp
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=expo-flow
spring.ai.mcp.server.instructions=Drives the Vaadin app Expo Flow in the browser tab opened last. \
  Call inspect first; the AI Driven UI area lives under the routes ai/grid, ai/form, ai/invoices, \
  ai/dashboard, ai/macros and ai/guardrails.
# Vaadin serves every path by default; leave /mcp to Spring AI's MCP endpoint
vaadin.exclude-urls=/mcp,/mcp/**
